name: "Naca"

data:
  N_train: 500
  N_val: 100
  N_test: 250

training:
  N_epochs: 500
  batch_size: 4
  lr: 1.0e-3
  weight_decay: 1.0e-4
  convergence_patience: 50
  max_grad_norm: null

inference:
  split: 'test' # 'train' or 'test'

model:
    d: 2
    n_layers: 8
    n_hidden: 128
    n_heads: 8
    dropout: 0.0
    mlp_ratio: 1
    fun_dim: 0
    out_dim: 1
    slice_num: 64
    ref: 8
    unified_pos: 0
    act: 'gelu'

uq:
  fit: False
  train_epochs: 500
  convergence_patience: 10
  noise_model: 'heteroskedastic' # 'homoskedastic' or 'heteroskedastic'
  nn_lr: 2.0e-3
  gp_lr: 5.0e-2
  nn_weight_decay: 1.0e-4
  aggregation: 'gpoe'